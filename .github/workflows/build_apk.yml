name: Build Wasalny (APK for Android & IPA for iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. بناء ملف الـ APK للأندرويد
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: wasalny_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: wasalny_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Wasalny-Android-APK
          path: wasalny_app/build/app/outputs/flutter-apk/app-release.apk

  # 2. بناء ملف الـ IPA للآيفون
  build-ios:
    name: Build iOS IPA (iPhone)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: wasalny_app
        run: flutter pub get

      - name: Build iOS Application
        working-directory: wasalny_app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        working-directory: wasalny_app
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Wasalny.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wasalny-iOS-IPA
          path: wasalny_app/Wasalny.ipa
